<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Film</title>
<!-- A click-through page for the film: each scene is a page. The action plays by itself, "Next" (or →, or a click on
     the picture) goes through the object into the next scene. Text, colours, fonts and the call to action come from
     `site` in film.js and `page` in each scene (see references/live.md). -->
<style>
  :root {
    /* layout: one column; the film is the page, the caption sits under it like a picture-book line */
    --bg: #14120f; --panel: #1d1a16; --fg: #f3eee6; --muted: #a39b8e; --line: #34302a; --accent: #e9b44c;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); }
  body { padding-inline: 16px; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
  .wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; padding-block: 20px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font: 600 clamp(22px, 3vw, 30px)/1.15 var(--display); letter-spacing: .01em; text-wrap: balance; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { font: 500 13px var(--body); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); }
  /* the film and its caption fit in one screen: the stage shrinks with the window height */
  .film { width: min(100%, max(320px, calc((100svh - 250px) * 16 / 9))); margin-inline: auto; display: grid; gap: 18px; }
  #stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { cursor: pointer; touch-action: manipulation; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10, 9, 7, .35); border: 0; cursor: pointer; color: #fff; }
  #start span { font: 600 18px var(--body); padding: 14px 26px; border-radius: 999px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); }
  body.started #start { display: none; }
  .caption { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr) auto; gap: 24px; align-items: start; }
  .where { display: grid; gap: 2px; }
  .count { font: 500 12px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  .year { font: 600 clamp(30px, 4.4vw, 52px)/1 var(--display); color: var(--accent); font-variant-numeric: lining-nums; }
  .story { min-width: 0; transition: opacity .35s ease; }
  .story.fade { opacity: 0; }
  .story h2 { margin: 2px 0 6px; font: 600 clamp(19px, 2.2vw, 24px)/1.25 var(--display); text-wrap: balance; }
  .story p { margin: 0; color: var(--muted); max-width: 62ch; }
  .nav { display: flex; gap: 8px; }
  .nav button, .cta { font: 600 14px var(--body); border-radius: 999px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  .nav button.next { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .nav button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chapters { display: flex; gap: 6px; padding: 0; margin: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
  .chapters button { display: grid; gap: 6px; min-width: 64px; padding: 8px 4px 2px; background: none; border: 0; color: var(--muted); font: 500 12px var(--body); cursor: pointer; text-align: left; font-variant-numeric: tabular-nums; }
  .chapters button::before { content: ""; height: 3px; border-radius: 2px; background: var(--line); }
  .chapters button.done::before { background: var(--muted); }
  .chapters button.now { color: var(--fg); }
  .chapters button.now::before { background: var(--accent); }
  .outro { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 22px; }
  .outro p { margin: 0; max-width: 62ch; color: var(--muted); }
  .cta { text-decoration: none; background: var(--accent); color: var(--bg); border-color: var(--accent); }
  footer { font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) {
    .caption { grid-template-columns: 1fr; gap: 10px; }
    .where { grid-auto-flow: column; justify-content: start; align-items: baseline; gap: 12px; }
    .nav { justify-content: stretch; } .nav button { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .story { transition: none; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">&nbsp;</h1>
    <div class="seg" role="group" aria-label="How to watch">
      <button id="m-pages" aria-pressed="true">Page by page</button><button id="m-film" aria-pressed="false">Watch</button>
    </div>
  </header>
  <div class="film">
  <div id="stage">
    <canvas id="c" width="1920" height="1080"></canvas><canvas id="overlay" width="1920" height="1080"></canvas>
    <button id="start" aria-label="Start"><span>▶ Start</span></button>
  </div>
  <div class="caption">
    <div class="where"><span class="count" id="count">1 / 1</span><span class="year" id="year"></span></div>
    <div class="story" id="story"><h2 id="heading"></h2><p id="text"></p></div>
    <div class="nav"><button id="prev" aria-label="Previous page">← Back</button><button id="next" class="next">Next →</button></div>
  </div>
  <ol class="chapters" id="chapters"></ol>
  </div>
  <section class="outro" id="outro" hidden><p id="intro"></p><a class="cta" id="cta" hidden></a></section>
  <footer id="credit"></footer>
</div>
<script src="runtime/core.js"></script>
<script src="runtime/rig.js"></script>
<script src="runtime/character.js"></script>
<script src="runtime/stage.js"></script>
<script src="runtime/main.js"></script>
<script src="runtime/player.js"></script>
<script src="film.js"></script>
<script>
ready.then(() => {
  const $ = id => document.getElementById(id), cfg = window.FILM_CFG || {}, site = cfg.site || {}, P = window.PLAYER;
  // theme + fonts from film.js
  const th = site.theme || {}, root = document.documentElement.style;
  for (const [k, v] of Object.entries(th)) root.setProperty('--' + k, v);
  if (site.fonts) { if (site.fonts.href) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = site.fonts.href; document.head.appendChild(l); }
    if (site.fonts.display) root.setProperty('--display', site.fonts.display); if (site.fonts.body) root.setProperty('--body', site.fonts.body); }
  const title = site.title || cfg.title || 'Film'; document.title = title; $('title').textContent = title;
  if (site.intro || site.cta) { $('outro').hidden = false; $('intro').textContent = site.intro || '';
    if (site.cta) { const a = $('cta'); a.hidden = false; a.textContent = site.cta.label; a.href = site.cta.href; a.target = '_blank'; a.rel = 'noopener'; } }
  $('credit').textContent = site.credit ?? '';
  // pages
  const pages = STAGE.shots.map(sh => ({ year: sh.sc.year || '', heading: (sh.sc.page && sh.sc.page.heading) || sh.sc.title || '', text: (sh.sc.page && sh.sc.page.text) || '' }));
  const n = pages.length, list = $('chapters');
  pages.forEach((pg, k) => { const li = document.createElement('li'), b = document.createElement('button');
    b.textContent = pg.year || String(k + 1); b.title = pg.heading; b.onclick = () => { start(); P.chapter(k); }; li.appendChild(b); list.appendChild(li); });
  let shown = -1;
  const show = k => {
    if (k === shown) return; shown = k; const pg = pages[k], story = $('story');
    $('count').textContent = `${k + 1} / ${n}`; $('year').textContent = pg.year;
    story.classList.add('fade'); setTimeout(() => { $('heading').textContent = pg.heading; $('text').textContent = pg.text; story.classList.remove('fade'); }, 180);
    [...list.querySelectorAll('button')].forEach((b, i) => { b.classList.toggle('now', i === k); b.classList.toggle('done', i < k); if (i === k) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    $('prev').disabled = k === 0;
  };
  const start = () => { document.body.classList.add('started'); if (!P.playing) P.play(); };
  $('start').onclick = start;
  $('next').onclick = () => { if (P.t >= P.total - 0.01) { P.restart(); P.play(); return; } start(); P.next(); };
  $('prev').onclick = () => { start(); P.prev(); };
  const setMode = m => { P.setMode(m); $('m-pages').setAttribute('aria-pressed', m === 'pages'); $('m-film').setAttribute('aria-pressed', m === 'film'); if (m === 'film') start(); };
  $('m-pages').onclick = () => setMode('pages'); $('m-film').onclick = () => setMode('film');
  setMode('pages');
  P.onTick(p => { show(p.page); const end = p.t >= p.total - 0.01; $('next').textContent = end ? 'Watch again ↺' : 'Next →';
    $('next').disabled = !end && p.page === n - 1 && p.mode === 'pages'; });
  show(0);
});
</script>
</body></html>
