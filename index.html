<!doctype html>
<html><head>
<script>if (!location.search && !location.hash) location.replace("site.html");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>portal film</title>
<style>
  html,body{margin:0;background:#111;color:#ddd;font:13px system-ui,sans-serif}
  #stage{position:relative;width:min(100vw,calc((100vh - 56px)*16/9));aspect-ratio:16/9;margin:0 auto;background:#000}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #overlay{cursor:pointer;touch-action:none}
  .bar{display:flex;gap:10px;align-items:center;padding:10px 16px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
  .bar button,.bar select{font:inherit;background:#222;color:#ddd;border:1px solid #444;border-radius:6px;padding:5px 10px;cursor:pointer}
  input[type=range]{flex:1;min-width:120px}
  body.render .bar,body.render #overlay{display:none} body.render #stage{width:1920px;height:1080px}
</style>
<!-- three.js for characters made with it (live 3D); only fetched if a character module imports it -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas><canvas id="overlay" width="1920" height="1080"></canvas></div>
<div class="bar">
  <button id="play">play</button><button id="restart">⟲</button>
  <select id="mode"><option value="film">film</option><option value="storybook">storybook</option><option value="play">play</option><option value="explore">explore</option><option value="pages">pages</option></select>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0"><span id="time">0.00</span>
  <button id="rec">● record</button><button id="full">⛶</button>
</div>
<script>if (/render=1/.test(location.search)) document.body.classList.add('render');</script>
<script src="runtime/core.js"></script>
<script src="runtime/rig.js"></script>
<script src="runtime/character.js"></script>
<script src="runtime/stage.js"></script>
<script src="runtime/main.js"></script>
<script src="runtime/player.js"></script>
<script src="film.js"></script>
</body></html>
